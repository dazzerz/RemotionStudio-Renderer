name: Remotion Chunked Cloud Renderer

on:
  workflow_dispatch:
    inputs:
      composition_id:
        description: 'ID Komposisi Remotion'
        required: true
        default: 'AircraftPlugDoorExplainer'
      output_filename:
        description: 'Nama file output MP4'
        required: true
        default: 'output.mp4'
      chunks:
        description: 'Jumlah chunk paralel'
        required: true
        default: '5'
      concurrency:
        description: 'Worker concurrency per chunk'
        required: true
        default: '4'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.calc.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci || npm install
      - id: calc
        run: |
          TOTAL=$(npx remotion compositions src/index.ts | awk -v id="${{ github.event.inputs.composition_id }}" '{ gsub(/\x1b\[[0-9;]*m/, ""); if ($1 == id || $1 ~ ("/" id "$")) { print $4; exit } }')
          if [ -z "$TOTAL" ]; then
            echo "Composition ${{ github.event.inputs.composition_id }} not found"
            exit 1
          fi
          CHUNKS=${{ github.event.inputs.chunks }}
          MATRIX=$(python3 - <<PY
          import json, math
          total = int("$TOTAL")
          chunks = int("$CHUNKS")
          step = math.ceil(total / chunks)
          items = []
          for i in range(chunks):
              start = i * step
              end = min(total - 1, (i + 1) * step - 1)
              if start <= end:
                  items.append({"idx": i, "range": f"{start}-{end}"})
          print(json.dumps({"include": items}))
          PY
          )
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  render_chunk:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji fonts-dejavu-core libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 libasound2t64 libpangocairo-1.0-0 libxss1
      - run: npm ci || npm install
      - run: |
          mkdir -p renders
          npx remotion render "${{ github.event.inputs.composition_id }}" "renders/chunk_${{ matrix.idx }}.mp4" \
            --frames="${{ matrix.range }}" \
            --concurrency="${{ github.event.inputs.concurrency }}" \
            --log=info \
            --gl=swangle
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.idx }}
          path: renders/chunk_${{ matrix.idx }}.mp4
          retention-days: 1

  merge:
    needs: render_chunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: chunks
          pattern: chunk-*
          merge-multiple: true
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p renders
          ls -1v chunks/chunk_*.mp4 | sed "s|^|file '|;s|$|'|" > concat.txt
          cat concat.txt
          ffmpeg -y -f concat -safe 0 -i concat.txt -c:v copy -c:a aac -b:a 192k -movflags +faststart "renders/${{ github.event.inputs.output_filename }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.output_filename }}
          path: renders/${{ github.event.inputs.output_filename }}
          retention-days: 7
